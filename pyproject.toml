[project]
name = "staywise-room-booking"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1,<6.0",
    "PyMySQL>=1.1.1",
    "Pillow>=10.4.0",
    "reportlab>=4.2.2",
    "python-dotenv>=1.0.1",
    "psycopg[binary]>=3.2",
    "vercel>=0.11",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.vercel.scripts]
build = "python build.py"
