{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="wrap profile-layout">
  <div class="page-intro">
    <p class="eyebrow">Operations / rooms</p>
    <h1>{{ title|cut:'room' }}<br /><em>room.</em></h1>
    <p>Give guests the details they need to choose well.</p>
  </div>
  <div class="form-panel">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}{% for field in form %}<label
        >{{ field.label }}{{ field }}{% if field.errors %}<span
          class="field-error"
          >{{ field.errors|striptags }}</span
        >{% endif %}</label
      >{% endfor %}<button class="button" type="submit">
        Save room <span>→</span>
      </button>
    </form>
  </div>
</section>
{% endblock %}
