{% extends 'base.html' %}
{% block title %}Profile{% endblock %}
{% block content %}
<section class="wrap profile-layout">
  <div class="page-intro">
    <p class="eyebrow">Your account</p>
    <h1>Make it <em>yours.</em></h1>
    <p>Keep your details current for a smoother arrival.</p>
  </div>
  <div class="form-panel">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}{% for field in form %}<label
        >{{ field.label }}{{ field }}{% if field.errors %}<span
          class="field-error"
          >{{ field.errors|striptags }}</span
        >{% endif %}</label
      >{% endfor %}<button class="button" type="submit">
        Save changes <span>→</span>
      </button>
    </form>
  </div>
</section>
{% endblock %}
