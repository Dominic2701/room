{% extends 'base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="auth-page">
  <div class="auth-aside">
    <p class="eyebrow">Welcome back</p>
    <h1>Your next good stay is waiting.</h1>
  </div>
  <div class="form-panel">
    <h2>Sign in</h2>
    <p class="form-intro">Access your bookings and profile.</p>
    <form method="post">
      {% csrf_token %}<label
        >Username<input name="username" required autofocus /></label
      ><label
        >Password
        <div class="password-field">
          <input type="password" name="password" required /><button
            type="button"
            class="password-toggle"
          >
            Show
          </button>
        </div></label
      ><button class="button button-full" type="submit">
        Sign in <span>→</span>
      </button>
    </form>
    <p class="form-foot">
      New to staywise? <a href="{% url 'register' %}">Create an account</a>
    </p>
  </div>
</section>
{% endblock %}
